services:
  postgres:
    image: postgres:17
    container_name: finanzas_dmos_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: finanzas_dmos_server
    restart: always
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_MAIN}
    ports:
      - "${SERVER_PORT_MAIN}:8010"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build: ./client
    container_name: finanzas_dmos_client
    restart: always
    environment:
      API_URL: http://server:8010
    ports:
      - "${CLIENT_PORT_MAIN}:8012"
    depends_on:
      - server

volumes:
  postgres_data:
